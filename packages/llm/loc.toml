[package]
name = "llm"
version = "0.1.0"
description = "Tiny LLM inference and training demo for Lingua Omnibus (inspired by llm.asm)"
license = "Apache-2.0"
authors = ["Claudiu Groza (Vemeth) <claudiu@lingua-omnibus.org>"]
homepage = "https://github.com/claudiuradugroza/LinguaOmnibus/tree/main/packages/llm"
repository = "https://github.com/claudiuradugroza/LinguaOmnibus"
spec_compatibility = "0.1"
lir_version = "1.2.0"

[dependencies]
std.io   = "0.1"
std.core = "0.1"

[llm]
default_lang = "en"
languages = ["en"]