name: Backend PowerPC Tests
on: [push, pull_request]
jobs:
  test-powerpc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU user-mode
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static

      - name: Install cross-compiler
        run: sudo apt-get install -y gcc-powerpc64-linux-gnu

      - name: Build loc
        run: cargo build --release --manifest-path impl/loc/Cargo.toml

      - name: Compile hello-world for PowerPC
        run: |
          ./impl/loc/target/release/loc build examples/hello-world/hello-en.lo \
            --target=powerpc64-unknown-linux-gnu \
            -o /tmp/hello-powerpc

      - name: Run under QEMU
        run: |
          qemu-ppc64-static -L /usr/powerpc64-linux-gnu /tmp/hello-powerpc
        # Expected output: Hello, world!