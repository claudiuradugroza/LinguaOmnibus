name: Backend RISC-V Tests
on: [push, pull_request]
jobs:
  test-riscv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU user-mode
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static

      - name: Install cross-compiler
        run: sudo apt-get install -y gcc-riscv64-linux-gnu

      - name: Build loc
        run: cargo build --release --manifest-path impl/loc/Cargo.toml

      - name: Compile hello-world for RISC-V
        run: |
          ./impl/loc/target/release/loc build examples/hello-world/hello-en.lo \
            --target=riscv64-unknown-linux-gnu \
            -o /tmp/hello-riscv

      - name: Run under QEMU
        run: |
          qemu-riscv64-static -L /usr/riscv64-linux-gnu /tmp/hello-riscv
        # Expected output: Hello, world!